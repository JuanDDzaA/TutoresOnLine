<main>
<div class="card">
  <h1>Próximas sesiones</h1>
  <p id="mensaje" class="aviso" role="status" aria-live="polite" hidden></p>
  <div id="proximas"></div>

  <div class="cta">
    <div>
      <strong>¿Necesitas ayuda ya?</strong>
      <p>Conecta con un tutor disponible en este momento.</p>
    </div>
    <button class="btn-sm" type="button" id="btn-ahora">Solicitar tutor ahora</button>
  </div>
  <div class="panel-ahora" id="panel-ahora" hidden>
    <label class="sr" for="materia-ahora">Materia</label>
    <select id="materia-ahora"></select>
    <button class="btn-sm" type="button" id="btn-ahora-ok">Buscar tutor y enviar solicitud</button>
  </div>

  <h2>Historial</h2>
  <div id="historial"></div>
</div>
</main>
